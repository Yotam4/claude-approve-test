# Copied from anthropics/claude-code-action examples/agent-approval-check.yml,
# action pinned to 4411a9e9b0283becf4b924f7bce360fd7756c78c (main / v1 on 2026-11-27).
name: agent-approval-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action/agent-approval-check@4411a9e9b0283becf4b924f7bce360fd7756c78c
        with:
          required_approvals: 1
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
